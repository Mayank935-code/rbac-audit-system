<!-- File: templates/signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RBAC Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f7f9fc;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .signup-card {
      background-color: #ffffff;
      border-radius: 20px;
      padding: 3rem;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    .signup-header {
      background-color: #1f2937;
      color: #f97316;
      padding: 1rem;
      border-radius: 10px;
      font-size: 1.8rem;
      text-align: center;
      font-weight: bold;
      margin-bottom: 2rem;
    }
    .form-label {
      font-weight: 500;
      color: #1f2937;
    }
    .form-control:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 0.2rem rgba(249, 115, 22, 0.25);
    }
    .btn-orange {
      background-color: #f97316;
      border: none;
      color: white;
      font-weight: 500;
      width: 50%;
      border-radius: 10px;
    }
    .btn-orange:hover {
      background-color: #ea580c;
    }
    .form-select:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 0.2rem rgba(249, 115, 22, 0.25);
    }
    .input-group-text {
      background-color: #f3f4f6;
    }
  </style>
</head>
<body>
  <div class="signup-card">
    <div class="signup-header">📝 Sign Up to RBAC Portal</div>

    <form id="signup-form">
      <div class="row mb-3">
        <div class="col-md-4">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullName" name="name" required />
        </div>
        <div class="col-md-4">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required />
        </div>
        <div class="col-md-4">
          <label for="role" class="form-label">Role</label>
          <select class="form-select" id="role" name="role" required>
            <option value="">Select Role</option>
            <option>HR</option>
            <option>Manager</option>
            <option>Intern</option>
            <option>Auditor</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="department" class="form-label">Department</label>
          <select class="form-select" id="department" name="department" required>
            <option value="">Select Department</option>
            <option>Human Resources</option>
            <option>Engineering</option>
            <option>Finance</option>
            <option>Marketing</option>
            <option>Legal</option>
            <option>IT Infrastructure</option>
            <option>Sales</option>
            <option>Customer Support</option>
            <option>Product Management</option>
            <option>Operations</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="doj" class="form-label">Date of Joining</label>
          <input type="date" class="form-control" id="doj" name="doj" required />
        </div>
        <div class="col-md-4">
          <label for="salary" class="form-label">Salary</label>
          <input type="number" class="form-control" id="salary" name="salary" required />
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" name="password" required />
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
          </div>
        </div>
        <div class="col-md-6">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" required />
        </div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-orange">Sign Up</button>
      </div>

      <div class="mt-3 text-center">
        <span>Already have an account?</span>
        <a href="/login" class="text-decoration-none" style="color: #f97316; font-weight: 500;">Login</a>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById("signup-form");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
      const type = password.type === "password" ? "text" : "password";
      password.type = type;
      togglePassword.textContent = type === "password" ? "Show" : "Hide";
    });

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      if (password.value !== confirmPassword.value) {
        alert("❌ Passwords do not match!");
        return;
      }

      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("fullName").value.trim(),
          email: document.getElementById("email").value.trim(),
          role: document.getElementById("role").value,
          department: document.getElementById("department").value,
          doj: document.getElementById("doj").value,
          salary: document.getElementById("salary").value,
          password: password.value
        })
      });

      const data = await res.json();
      if (data.success) {
        alert("✅ Signup request submitted!");
        form.reset();
      } else {
        alert("❌ Signup failed: " + data.message);
      }
    });
  </script>
</body>
</html>
