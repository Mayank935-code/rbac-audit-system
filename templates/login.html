<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RBAC Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f7f9fc;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .login-card {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }
    .brand-logo {
      font-size: 2rem;
      padding: 0.7rem;
      font-weight: bold;
      color: #f97316;
      background-color: #1f2937;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 2rem;
    }
    .form-label {
      font-weight: 600;
      color: #1f2937;
    }
    .form-control:focus {
      border-color: #f97316;
      box-shadow: 0 0 0 0.2rem rgba(249, 115, 22, 0.25);
    }
    .btn-primary {
      background-color: #f97316;
      border: none;
    }
    .btn-primary:hover {
      background-color: #ea580c;
    }
    .btn-outline-secondary {
      border-color: #6c757d;
      color: #6c757d;
    }
    .btn-outline-secondary:hover {
      background-color: #6c757d;
      color: white;
    }

    a {
      color: #f97316;
    }
    .toast-body {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-logo">🔐 Secure RBAC Portal</div>

    <!-- Alert for invalid credentials -->
    <div id="error-alert" class="alert alert-danger d-none" role="alert">
      ❌ Invalid username or password!
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Enter username" required />
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required />
          <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
        </div>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">
          <span id="login-text">Login</span>
          <span id="login-spinner" class="spinner-border spinner-border-sm d-none"></span>
        </button>
      </div>
    </form>

    <div class="mt-3 text-center">
      <span>Don't have an account?</span>
      <a href="/signup" class="text-decoration-none">Sign up</a>
    </div>
  </div>

  <!-- Toast -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999">
    <div id="login-toast" class="toast align-items-center text-bg-success border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">✅ Login successful! Redirecting...</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const togglePassword = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      togglePassword.addEventListener("click", () => {
        const type = passwordInput.type === "password" ? "text" : "password";
        passwordInput.type = type;
        togglePassword.textContent = type === "password" ? "Show" : "Hide";
      });

      const loginForm = document.getElementById("login-form");
      const loginText = document.getElementById("login-text");
      const loginSpinner = document.getElementById("login-spinner");
      const errorAlert = document.getElementById("error-alert");
      const toast = new bootstrap.Toast(document.getElementById("login-toast"));

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault(); // Prevent default form submission

        loginText.classList.add("d-none");
        loginSpinner.classList.remove("d-none");
        errorAlert.classList.add("d-none");

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          console.log("Login Response:", data);
          // alert("Redirecting to: " + data.redirect);

          loginText.classList.remove("d-none");
          loginSpinner.classList.add("d-none");

          if (data.success) {
            toast.show();

            setTimeout(() => {
              window.location.href = data.redirect;
            }, 1500);
          } else {
            errorAlert.classList.remove("d-none");
          }

        } catch (err) {
          console.error("Login JS Error:", err);
          loginText.classList.remove("d-none");
          loginSpinner.classList.add("d-none");
          errorAlert.classList.remove("d-none");
        }
      });
    </script>
</body>
</html>
